name: CI Build & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否创建 Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release 版本号 (如 v1.0.1)'
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/Translater.sln

      - name: Build
        run: dotnet build src/Translater.sln -c Release --no-restore

      - name: Publish
        run: |
          dotnet publish src/Translater.App -c Release -r win-x64 --self-contained true -o publish /p:PublishReadyToRun=true

      - name: Archive release
        run: Compress-Archive -Path publish/* -DestinationPath Translater-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Translater-win-x64
          path: Translater-win-x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: inputs.create_release == true
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Translater-win-x64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: Translater-win-x64.zip
          generate_release_notes: true
